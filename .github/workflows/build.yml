name: Build & Release (Go)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]            # Triggers release build on tags like v0.1.0
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write             # Required to create GitHub Releases and upload assets

jobs:
  # 1. Run unit tests first
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run Tests
        run: go test -v ./...

  # 2. Cross-compile and bundle into .tar.gz
  build-and-package:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0 # Statically linked pure Go binary
        run: |
          mkdir -p dist_bin
          BIN_NAME="iradio${{ matrix.ext }}"
          # If your main.go is in ./cmd/iradio, change '.' to './cmd/iradio'
          go build -trimpath -ldflags="-s -w" -o "dist_bin/${BIN_NAME}" .

      - name: Package into .tar.gz
        run: |
          mkdir -p dist
          ARCHIVE_NAME="iradio-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czvf "dist/${ARCHIVE_NAME}" -C dist_bin .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # 3. Publish to GitHub Releases only when a tag is pushed
  release:
    name: Publish GitHub Release
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: package-*
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
