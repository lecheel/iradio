name: Build & Package

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: iradio
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: iradio
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: iradio.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libasound2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Run Tests
        run: cargo test --verbose

      - name: Package into tar.gz (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czvf dist/iradio-${{ matrix.target }}.tar.gz -C target/release ${{ matrix.bin_name }}

      # Windows runner has bsdtar/tar pre-installed in PowerShell/cmd
      - name: Package into tar.gz (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czvf dist/iradio-${{ matrix.target }}.tar.gz -C target/release ${{ matrix.bin_name }}

      - name: Upload .tar.gz Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iradio-${{ matrix.target }}.tar.gz
          path: dist/iradio-${{ matrix.target }}.tar.gz
          if-no-files-found: error
